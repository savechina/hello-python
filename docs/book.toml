[book]
authors = ["RenYan Wei"]
language = "zh"
src = "src"
title = "Hello Python — Python 教程"
description = "系统化的 Python 学习教程，从基础语法到进阶实战，涵盖变量、数据类型、控制流、函数、OOP、异步编程、FastAPI、依赖注入、数据库、NumPy 等内容。每个知识点都有独立的可运行示例代码和测试。"

[preprocessor.admonish]
assets_version = "3.1.0"

[preprocessor.alerts]

[preprocessor.pagetoc]

[output.html]
site-url = "https://renyan.org/hello/python/"
default-theme = "light"
git-repository-url = "https://github.com/savechina/hello-python"
git-repository-icon = "fa-github"
additional-css = ["./assets/css/mdbook-admonish.css", "./theme/pagetoc.css"]
additional-js = ["./theme/pagetoc.js"]
